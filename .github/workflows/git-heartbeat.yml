name: Git Heartbeat

# Só existe para manter o repositório "ativo" e evitar que o GitHub
# desative workflows agendados (schedule) por 60 dias de inatividade.
# Não toca no Supabase, não usa secrets.

on:
  schedule:
    - cron: '0 9 1 * *'   # dia 1 de cada mês, 9h UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update last-run marker (keeps repo active)
        run: |
          mkdir -p .heartbeat
          echo "Last successful run: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .heartbeat/last-run.txt
          git config user.name "heartbeat-bot"
          git config user.email "actions@github.com"
          git add .heartbeat/last-run.txt
          git diff --staged --quiet || git commit -m "chore: heartbeat run $(date -u +%Y-%m-%d)"
          git push
